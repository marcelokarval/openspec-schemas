name: superpowers-bridge
version: 2
description: >
  OpenSpec artifacts with Superpowers planning and execution discipline.
  Local guard checks are advisory, not independent evidence or runtime enforcement.
artifacts:
  - id: brainstorm
    generates: brainstorm.md
    description: Capture approved design exploration
    template: brainstorm.md
    instruction: |
      Resolve the brainstorming capability to an available native skill name,
      for example brainstorming or superpowers:brainstorming. Record the mapping
      and actual invocation. If unavailable STOP; discovery is not execution.
      Capture the approved discussion in this change's brainstorm.md.
    requires: []
  - id: proposal
    generates: proposal.md
    description: Define scope and capabilities
    template: proposal.md
    instruction: |
      Create the proposal from brainstorm.md, including exact capability names.
    requires: [brainstorm]
  - id: design
    generates: design.md
    description: Structure the approved design
    template: design.md
    instruction: |
      Organize the decisions, goals, trade-offs and migration from brainstorm.md.
    requires: [brainstorm]
  - id: specs
    generates: "specs/**/*.md"
    description: Testable capability requirements
    template: spec.md
    instruction: |
      Create specs/<capability>/spec.md for each proposal capability with
      requirements and testable scenarios. Follow the template's ADDED,
      MODIFIED, REMOVED and RENAMED delta semantics including full modified
      requirements, Reason/Migration for removals and FROM/TO for renames.
    requires: [proposal]
  - id: tasks
    generates: tasks.md
    description: Stable coarse task checklist
    template: tasks.md
    instruction: |
      Use unique stable numeric IDs as in the template; map plan steps to IDs.
      Do not silently defer mandatory tasks.
    requires: [specs, design]
  - id: plan
    generates: plan.md
    description: Task-mapped implementation plan
    template: plan.md
    instruction: |
      Resolve writing-plans or superpowers:writing-plans to the observed skill,
      invoke it, and record the mapping and invocation. STOP if unavailable.
      Preserve artifact ownership; write this change's plan.md. Map micro-steps
      to stable task IDs, with RED/GREEN commands and candidate review evidence.
      Do not automatically commit.
    requires: [tasks]
  - id: verify
    generates: verify.md
    description: Post-implementation verification
    template: verify.md
    instruction: |
      Before preflight, create candidate-manifest.json with explicit relevant
      implementation paths and final present/absent states, including ignored
      files. After implementation run the candidate guard with explicit repository,
      base and change. Record the candidate hash in verify.md. Run and record
      mandatory structural validation, tests and independent review; an
      unavailable check is NOT VERIFIED, not PASS. Check spec/design coherence
      and unresolved mandatory tasks and deferred gaps. Run bridge_guard.py
      verify with the same arguments after recording exactly one positive
      verdict and structured evidence.json with exact RED expected_failure and
      GREEN passed outcomes. Guard success validates format and
      freshness only for declared files, not completeness or the claims.
      A semantic review and human acceptance remain separate requirements.
    requires: [plan]
  - id: retrospective
    generates: retrospective.md
    description: Evidence-first retrospective
    template: retrospective.md
    instruction: |
      Run bridge_guard.py verify with the same explicit repository, base and
      change. STOP on any failure. Write an evidence-based retrospective;
      self-reported results are not independent proof or human approval.
    requires: [verify]
apply:
  requires: [plan]
  tracks: tasks.md
  instruction: |
    Select an already authorized repository workspace and explicit Git base.
    Run python3 <bundle>/scripts/bridge_guard.py preflight --repo <repo>
    --base <base> --change <change>. Quote arguments in a shell. STOP if the
    named change or required artifacts are missing; do not reconstruct them.
    Workspace creation or transfer needs separate authorization and preflight.
    Map native names explicitly, e.g. subagent-driven-development or
    superpowers:subagent-driven-development, test-driven-development and
    requesting-code-review. Confirm actual invocation, not only discovery.
    Subagent mode is supported when explicitly authorized. Inline execution may
    use executing-plans plus applicable TDD and review, subject to user grants.
    Execute plan steps against stable task IDs, recording RED/GREEN evidence.
    Verify the exact candidate and request independent review. Archive, release,
    human acceptance, commits, worktree creation, PR, push and merge are separate
    decisions requiring appropriate explicit authorization; never automatic.
