name: Validate schemas

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    strategy:
      matrix:
        bridge:
          - superpowers-bridge

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Offline regression and metadata checks
        run: |
          python3 -m unittest discover -s tests -v
          jq -er '.openspec | strings | select(test("^[0-9]+\\.[0-9]+\\.[0-9]+$"))' superpowers-bridge/source-versions.json
          jq -er '.superpowers | strings | select(test("^v[0-9]+\\.[0-9]+\\.[0-9]+$"))' superpowers-bridge/source-versions.json

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"

      - name: Install OpenSpec CLI
        run: |
          version=$(jq -er '.openspec | strings | select(test("^[0-9]+\\.[0-9]+\\.[0-9]+$"))' superpowers-bridge/source-versions.json)
          npm install -g "@fission-ai/openspec@$version"

      - name: Set up temp project + install bridge
        run: |
          mkdir -p /tmp/test-project/openspec/schemas
          cp -R ${{ matrix.bridge }} /tmp/test-project/openspec/schemas/

      - name: Validate bridge schema
        working-directory: /tmp/test-project
        run: openspec schema validate ${{ matrix.bridge }}

      - name: List schemas (smoke test)
        working-directory: /tmp/test-project
        run: openspec schemas
